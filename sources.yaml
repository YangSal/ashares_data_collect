    headers: browser
    note: 美联储新闻稿/FOMC
  - id: sec_8k
    adapter: rss
    channel: us_filing
    job: news_us
    url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=8-K&company=&dateb=&owner=include&count=400&output=atom"
    proxy: us
    headers: sec_declared
    note: SEC EDGAR 8-K 滚动窗（声明式 UA，勿改浏览器 UA）
  - id: nyt_business
    adapter: rss
    channel: us_news
    job: news_us
    url: https://rss.nytimes.com/services/xml/rss/nyt/Business.xml
    proxy: us
    headers: browser
    note: 纽约时报商业（摘要丰富）
  - id: nyt_economy
    adapter: rss
    channel: us_news
    job: news_us
    url: https://rss.nytimes.com/services/xml/rss/nyt/Economy.xml
    proxy: us
    headers: browser
    note: 纽约时报经济
  - id: wsj_markets
    enabled: false  # 2026-09-07：官方 RSS 冻结于 2025-01；周探测候选，不删历史
    adapter: rss
    channel: us_news
    job: news_us
    url: https://feeds.a.dj.com/rss/RSSMarketsMain.xml
    proxy: us
    headers: browser
    note: 华尔街日报市场（付费墙只给标题）
  - id: wsj_business
    enabled: false  # 2026-09-07：官方 RSS 冻结于 2025-01；周探测候选
    adapter: rss
    channel: us_news
    job: news_us
    url: https://feeds.a.dj.com/rss/WSJcomUSBusiness.xml
    proxy: us
    headers: browser
    note: 华尔街日报商业
  - id: wsj_world
    enabled: false  # 2026-09-07：官方 RSS 冻结于 2025-01；周探测候选
    adapter: rss
    channel: us_news
    job: news_us
    url: https://feeds.a.dj.com/rss/RSSWorldNews.xml
    proxy: us
    headers: browser
    note: 华尔街日报世界
  - id: bloomberg_markets
    adapter: rss
    channel: us_news
    job: news_us
    url: https://feeds.bloomberg.com/markets/news.rss
    proxy: us
    headers: browser
    note: 彭博市场（标题）
  - id: guardian_business
    adapter: rss
    channel: us_news
    job: news_us
    url: https://www.theguardian.com/business/rss
    proxy: us
    headers: browser
    note: 卫报商业（RSS 直出全文）
  - id: marketwatch
    adapter: rss
