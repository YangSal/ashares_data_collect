# 数据源注册表：采集型源的单一事实来源（spec docs/superpowers/specs/2026-07-08-source-registry-design.md）
# - id 即归档目录名，不可变（改名=换存档，视为新源）
# - 改动流程：编辑 → python manage_sources.py validate → git 提交 → 目标机 pull
#   → 下一轮调度自动生效（子进程每轮重读，无需重启）
# - 新源上线：先 python manage_sources.py test <id> 冒烟，再置 enabled: true
version: 1

defaults:
  enabled: true

sources:
  # ================= news_policy（每小时 news_hourly）=================
  - id: govcn_policy
    adapter: rss
    channel: policy
    job: news_policy
    url: https://www.gov.cn/pushinfo/v150203/rss.xml
    headers: browser
    note: 中国政府网-最新政策
  - id: govcn_gwy
    adapter: api
    channel: policy
    job: news_regulator
    url: https://sousuo.www.gov.cn/search-gov/data
    headers: browser
    timeout: 90
    health_profile: event
    note: 国务院文件库官方接口；2026-10-14 替换失效旧 RSS，source/归档不变
  - id: stats
    adapter: rss
    channel: policy
    job: news_policy
    url: https://www.stats.gov.cn/sj/zxfb/rss.xml
    headers: browser
    timeout: 90
    # 2026-07-16 曾源头挂死停用；2026-07-27 健康探测冒烟(500条正常)确认恢复→重启用。若再挂按同法停。
    note: 国家统计局-最新发布
  - id: pbc_news
    adapter: rss
    channel: policy
    job: news_policy
    url: https://www.pbc.gov.cn/goutongjiaoliu/113456/2986536/index.html
    headers: browser
    health_profile: event
    note: 中国人民银行官方 RSS
  - id: em_cjzc
    adapter: akshare
    channel: media
    job: news_policy
    health_profile: continuous
    note: 东财财经早餐（既有代码源，登记健康和开关）

  # ================= news_us（每日 05:30，全部经 us 代理）=================
