  # ====== 单源 job（二期登记）：采集逻辑在代码，注册表提供 enabled kill-switch ======
  # adapter=akshare/api 的源不由注册表驱动拉取（列映射/API 分页在代码），仅登记
  # 元信息 + enabled 开关：置 false 则对应 job 的 run() no-op 跳过（见各 job）。
  - id: cctv
    adapter: akshare
    channel: cctv
    job: news_cctv
    note: 新闻联播文字稿（akshare news_cctv 主 + 官网直抓备源，逻辑在 news_cctv.py）
  - id: cninfo
    adapter: api
    channel: announcement
    job: news_announcement
    note: 公司公告（巨潮官方 API，逻辑在 utils/cninfo.py + news_announcement.py）
  - id: em_stock
    adapter: akshare
    channel: stock
    job: news_stock
    note: 个股新闻（东财 stock_news_em 全市场逐票，逻辑在 news_stock.py）

  # ====== news_flash（快讯）不进注册表 ======
  # flash 由 config.yaml 的 news.flash_sources 自治（cls/em/sina 零代码换源，cls
  # 事故已验证），且溢出检测/断流状态机与源列表深耦合。二期评估结论：保持现状，
  # 不并入注册表——flash_sources 即 flash 的专属 mini-registry（见 spec §N5/二期决策）。
