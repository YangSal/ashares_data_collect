database:
  host: "192.168.x.x"
  port: 5432
  user: "your_user"
  password: "your_password"
  database: "ashares"

dingtalk:
  webhook_token: "your_token_here"
  message_prefix: "XXXX"
  enabled: true      # 节点静默开关：false=只记日志不发送（config.local.yaml 每节点覆盖）

export:
  enable_csv: false
  base_dir: "tempdata"
  table_name: "minutedata_tdx"
  divid_factors_table: "divid_factors"

tick_storage:
  base_dir: "Z:\\A股冷数据\\TICK"
  compression: "zstd"

# wave3 与新闻日报共用 SMTP 发件账号；新闻日报收件人由 news.digest 单独指定。
wave3:
  email:
    smtp_server: "smtp.qq.com"
    smtp_port: 465
    sender: "your_sender@qq.com"
    app_key: "your_smtp_app_key"
    recipients: ["wave3_recipient@example.com"]

qmt:
  # QMT 安装目录；清理任务清空 {install_dir}\userdata_mini\datadir（本地行情缓存）
  install_dir: "D:\\国金QMT交易端模拟"

# 新闻系统（见 docs/superpowers/specs/2026-07-02-news-opensearch-plan.md）
opensearch:
  host: "192.168.x.x"
  port: 9200
  use_ssl: true
  verify_certs: false            # 内网自签证书
  user: "news_writer"            # 专用最小权限账号（news* 索引 CRUD + cluster_monitor）
  password: "your_password"

news:
  archive_base: "Z:\\A股冷数据\\news"     # 原始归档层（Windows 盘符路径）
  archive_base_posix: "/mnt/media/A股冷数据/news"  # Linux 用此（SMB/NAS 挂载点）——平台自动选
  # spool_dir: "D:\\path\\to\\news_spool"  # 可选，NAS 故障时本地暂存目录（缺省 <项目根>/news_spool）
  verify_days_back: 3                    # verify 自然日回溯天数
  digest:
    event_db: "output/news_digest.sqlite3" # 任务/告警/投递状态本地账本
    email_recipient: "your_email@example.com"    # 新闻日报唯一收件人
    retention_days: 30
    dingtalk_max_chars: 18000
  # flash_sources: [cls, em]             # 快讯生效源（可用 cls/em/sina；某源挂死时切换，零代码）
  # rsshub_bases:                         # 自建 RSSHub 有序实例；主故障才尝试备用
  #   - "http://192.168.1.10:1200"
  #   - "http://192.168.1.11:1200"
  # rsshub_base: "http://192.168.1.10:1200"  # 旧版兼容键；配置列表时列表优先
  # us_proxy: "http://127.0.0.1:7890"        # 美国源专用代理（仅 news_us 显式使用，其他 job 不碰）
  embedding:
    enabled: true                        # false=向量延迟(news_embed 空转,vec_status 留 pending 省储存),日后改 true 补算
    backend: "local"                     # local(sentence-transformers) | ollama
    model: "BAAI/bge-m3"                 # local=HF 名；ollama 时用 Ollama 模型名（如 "bge-m3"）
    device: "cpu"
    batch_size: 32
    # ollama_url: "http://192.168.1.12:11434"  # backend=ollama 时必填
  watch_stocks: []                       # 个股新闻关注池（二期）
  rss_sources: []                        # RSSHub/RSS 源清单（二期）

pipelines:
  # 每日 15:30 主流水线
  daily:
    schedule:
      hour: 15
      minute: 30
      timezone: "Asia/Shanghai"
    # timeout（秒）+ retries：xtquant 挂死时硬杀子进程并重试 N 次，仍失败发钉钉
    tasks:
      - name: a_share_daily
        job: data_collect.jobs.a_share_daily
        platform: windows
        timeout: 900
        retries: 1
      - name: wave3
        job: data_collect.jobs.wave3
        platform: windows
        depends_on: [a_share_daily]
        timeout: 300
        retries: 1
      - name: a_share_minute
        job: data_collect.jobs.a_share_minute
        platform: windows
        depends_on: [a_share_daily]
        timeout: 1200
        retries: 1
      - name: divid_factors
        job: data_collect.jobs.divid_factors
        platform: windows
        depends_on: [a_share_minute]
        timeout: 300
        retries: 1
      - name: a_share_instrument
        job: data_collect.jobs.a_share_instrument
        platform: windows
        depends_on: [divid_factors]
        timeout: 300
        retries: 1
      - name: a_share_sector
        job: data_collect.jobs.a_share_sector
        platform: windows
        depends_on: [a_share_instrument]
        timeout: 300
        retries: 1
      - name: a_share_index_weight
        job: data_collect.jobs.a_share_index_weight
        platform: windows
        depends_on: [a_share_sector]
        timeout: 300
        retries: 1
      - name: a_share_tick
        job: data_collect.jobs.a_share_tick
        platform: windows
        depends_on: [a_share_index_weight]
        timeout: 2400
        retries: 1
      # ETF 采集（接在股票任务之后，串行链；etf_nav 走 akshare 跨平台）
      - name: etf_daily
        job: data_collect.jobs.etf_daily
        platform: windows
        depends_on: [a_share_tick]
        timeout: 900
        retries: 1
      - name: etf_minute
        job: data_collect.jobs.etf_minute
        platform: windows
        depends_on: [etf_daily]
        timeout: 1800
        retries: 1
      - name: etf_divid_factors
        job: data_collect.jobs.etf_divid_factors
        platform: windows
        depends_on: [etf_minute]
        timeout: 600
        retries: 1
      - name: etf_info
        job: data_collect.jobs.etf_info
        platform: windows
        depends_on: [etf_divid_factors]
        timeout: 900
        retries: 1
      - name: etf_nav
        job: data_collect.jobs.etf_nav
        depends_on: [etf_info]
        timeout: 600
        retries: 1

  # 周六 8:00 — tick 查漏补缺最近 5 个交易日
  weekly_tick_verify:
    schedule:
      day_of_week: sat
      hour: 8
      minute: 0
      timezone: "Asia/Shanghai"
    tasks:
      - name: a_share_tick
        job: data_collect.jobs.a_share_tick
        platform: windows
        fn: run_verify
        days_back: 5
        timeout: 3600
        retries: 1

  # 周日 8:00 — daily/minute K线查漏补缺最近 10 个交易日
  weekly_kline_verify:
    schedule:
      day_of_week: sun
      hour: 8
      minute: 0
      timezone: "Asia/Shanghai"
    tasks:
      - name: a_share_daily
        job: data_collect.jobs.a_share_daily
        platform: windows
        fn: run_verify
        days_back: 10
        timeout: 1800
        retries: 1
      - name: a_share_minute
        job: data_collect.jobs.a_share_minute
        platform: windows
        fn: run_verify
        days_back: 10
        timeout: 3600
        retries: 1
      - name: etf_daily
        job: data_collect.jobs.etf_daily
        platform: windows
        fn: run_verify
        days_back: 10
        timeout: 1800
        retries: 1
      - name: etf_minute
        job: data_collect.jobs.etf_minute
        platform: windows
        fn: run_verify
        days_back: 10
        timeout: 3600
        retries: 1
      - name: etf_nav
        job: data_collect.jobs.etf_nav
        fn: run_verify
        days_back: 5
        timeout: 1800
        retries: 1

  # 每月最后一天 23:00 — 财务数据更新
  monthly_financial:
    schedule:
      day: last
      hour: 23
      minute: 0
      timezone: "Asia/Shanghai"
    tasks:
      - name: a_share_financial
        job: data_collect.jobs.a_share_financial
        platform: windows
        timeout: 5400
        retries: 1

  # 每月1号 23:00 — 清理 QMT 本地缓存（datadir 累积的可重下行情缓存）
  monthly_qmt_clean:
    schedule:
      day: 1
      hour: 23
      minute: 0
      timezone: "Asia/Shanghai"
    tasks:
      - name: clean_qmt_cache
        job: data_collect.jobs.clean_qmt_cache
        platform: windows
        timeout: 1800
        retries: 0

  # 新闻快讯 */15 分钟（成功静默，失败照发）
  news_flash:
    schedule: {minute: "*/15", timezone: "Asia/Shanghai", jitter: 600}
    notify: on_failure
    tasks:
      - {name: news_flash, job: data_collect.jobs.news_flash, timeout: 240, retries: 1}

  # 新闻小时级 :37 错峰——政策RSS → 个股全文 → 公告PDF → 补向量（串行避免带宽争抢）
  news_hourly:
    schedule: {minute: 37, timezone: "Asia/Shanghai", jitter: 600}
    notify: on_failure
    tasks:
      - {name: news_policy, job: data_collect.jobs.news_policy, timeout: 300, retries: 1}
      - {name: news_regulator, job: data_collect.jobs.news_regulator, timeout: 600,
         retries: 1, depends_on: [news_policy]}
      - {name: news_fulltext, job: data_collect.jobs.news_fulltext, timeout: 1800,
         retries: 1, depends_on: [news_regulator]}
      - {name: news_announce_pdf, job: data_collect.jobs.news_announce_pdf, timeout: 1800,
         retries: 1, depends_on: [news_fulltext]}
      - {name: news_embed, job: data_collect.jobs.news_embed, timeout: 900, retries: 1,
         depends_on: [news_announce_pdf]}

  # 新闻通知日报：前日18:00（含）至当日18:00（不含），无 jitter
  news_digest:
    schedule: {hour: 18, minute: 0, timezone: "Asia/Shanghai"}
    tasks:
      - {name: news_digest, job: data_collect.jobs.news_report,
         timeout: 180, retries: 2}

  # 新闻每日 20:40——联播采集+verify+快讯重放
  # 注：news 系 verify 忽略框架交易日窗口，按 news.verify_days_back 自然日回溯，故不写 days_back（框架不透传，写了是死配置）
  news_daily:
    schedule: {hour: 20, minute: 40, timezone: "Asia/Shanghai", jitter: 600}
    tasks:
      - {name: news_cctv, job: data_collect.jobs.news_cctv, timeout: 300, retries: 2}
      - {name: news_cctv_verify, job: data_collect.jobs.news_cctv, fn: run_verify,
         timeout: 300, retries: 0, depends_on: [news_cctv]}
      - {name: news_flash_verify, job: data_collect.jobs.news_flash, fn: run_verify,
         timeout: 600, retries: 0}
      # 公告采集（单查询全市场）+ verify 自然日回溯补昨日
      - {name: news_announcement, job: data_collect.jobs.news_announcement,
         timeout: 600, retries: 1}
      - {name: news_announcement_verify, job: data_collect.jobs.news_announcement,
         fn: run_verify, timeout: 600, retries: 0, depends_on: [news_announcement]}
      # 政策/宏观 + 监管/部委/官媒 归档重放补库（自然日窗口，同快讯 verify 语义）
      - {name: news_policy_verify, job: data_collect.jobs.news_policy,
         fn: run_verify, timeout: 300, retries: 0}
      - {name: news_regulator_verify, job: data_collect.jobs.news_regulator,
         fn: run_verify, timeout: 600, retries: 0}

  # 个股新闻 22:00——全市场逐票扫描(每票10条) + 自然日归档重放 verify
  news_stock:
    schedule: {hour: 22, minute: 0, timezone: "Asia/Shanghai", jitter: 600}
    tasks:
      - {name: news_stock, job: data_collect.jobs.news_stock, timeout: 7200, retries: 1}
      - {name: news_stock_verify, job: data_collect.jobs.news_stock, fn: run_verify,
         timeout: 900, retries: 0, depends_on: [news_stock]}

  # 美国政策/公司文件 每日 05:30（美股收盘+美东下午披露高峰后；需代理环境）
  news_us:
    schedule: {hour: 5, minute: 30, timezone: "Asia/Shanghai", jitter: 600}
    notify: on_failure
    tasks:
      - {name: news_us, job: data_collect.jobs.news_us, timeout: 300, retries: 1}
      - {name: news_us_verify, job: data_collect.jobs.news_us, fn: run_verify,
         timeout: 300, retries: 0, depends_on: [news_us]}
